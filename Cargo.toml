[workspace]
resolver = "3"
members = ["crates/vkcore", "crates/worldgen", "crates/engine"]
default-members = ["crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
shaderc = "0.10"
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rayon = "1"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png"] }
dear-imgui-rs = "0.22"
dear-imgui-winit = "0.22"
dear-imgui-ash = { version = "0.22", default-features = false }
dear-node-editor = "0.22"
dear-implot = "0.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
